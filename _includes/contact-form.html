<div class="contact-wrapper max-w-xl mx-auto px-6">
    <div class="text-center mb-10">
        <h2 class="text-4xl font-extrabold text-white mb-2">Get In <span class="text-gradient">Touch</span></h2>
        <p class="text-slate-400">Have a project in mind, or just want to say hi? Send me a message.</p>
    </div>

    <form id="contact-form" class="contact-card">
        <input class="form-input" type="text" name="name" placeholder="Your name" required>
        <input class="form-input" type="email" name="email" placeholder="Your email" required>
        <textarea class="form-input" name="message" rows="5" placeholder="Your message" required></textarea>
        <button type="submit" class="form-submit">Send Message</button>
    </form>
</div>
