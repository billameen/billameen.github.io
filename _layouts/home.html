<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../css/style.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    
    <!-- GSAP -->
    <script defer src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/SplitText.min.js"></script>

    <link rel="stylesheet" type='text/css' href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />

    <script type="module" src="../js/navbar.js"></script>
    <script defer src="../js/animate.js"></script>
    <title>{{title}}</title>
</head>



<body>

    <!-- <div id="croc"></div> -->

    <div id="top-bar">
        <div id="hamburger-btn">
            <i data-lucide="menu"></i>
        </div>
        <nav id="navbar-list" class="flex text-center">
            <a href="/" class="nav-button font-bold">
                <i data-lucide="user"></i>
                <span class="nav-text">About Me</span>
            </a>
            <a href="/work" class="nav-button font-bold">
                <i data-lucide="briefcase"></i>
                <span class="nav-text">My Work</span>
            </a>
            <a href="/games" class="nav-button font-bold">
                <i data-lucide="gamepad-2"></i>
                <span class="nav-text">My Games</span>
            </a>
            <script src="https://unpkg.com/lucide@latest"></script>
            <script>
                lucide.createIcons()
            </script>
        </nav>
    </div>

    <div id="about-me" class="bg-main-bg flex justify-center mt-10">
        <div id="pfp-wrapper"
            class="relative object-cover rounded-full w-32 h-32 sm:w-60 sm:h-60 md:w-70 md:h-70 lg:w-80 lg:h-80 mx-auto">
            <img id="profilepic" class="w-full h-full object-cover rounded-full relative z-10"
                src="./img/pictureOfMyself.jpg" alt="A Picture of Me!">
        </div>
    </div>


    <div id="techbar"></div>

    <div id="timeline"></div>


</body>

</html>
